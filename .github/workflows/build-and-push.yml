name: Build and Push (auto-deploy pipeline)

# Builds the backend (with NPU-conditional Hailo binaries, see beaver-iot-api-npu.dockerfile)
# and frontend images from source across all three repos, multi-arch, and pushes them to
# GHCR. Watchtower on the deployment machine polls the registry and redeploys on its own -
# this workflow's only job is to make sure a fresh image is there for it to find.
#
# Triggered two ways:
#   - repository_dispatch (type: source-updated): fired by the small "notify" workflow in
#     each of beaver-iot / beaver-iot-integrations / beaver-iot-web on push to their main
#     branch. This is what makes "push a feature anywhere" actually rebuild the image -
#     without it, pushing to those repos would do nothing, since the build itself lives here.
#   - workflow_dispatch: manual "build now" button, e.g. to retry after fixing a build
#     failure without needing an empty commit.

on:
  repository_dispatch:
    types: [source-updated]
  workflow_dispatch:
    inputs:
      api_git_branch:
        description: 'Branch to build in beaver-iot / beaver-iot-integrations'
        required: true
        default: 'main'
      web_git_branch:
        description: 'Branch to build in beaver-iot-web'
        required: true
        default: 'main'

env:
  # Point these at your own forks once created - see the deployment guide.
  # Named cytron-beaver-iot, not beaver-iot, in this fork - GitHub doesn't redirect
  # git-clone-over-HTTPS on a rename the way it does browser URLs, so this has to be
  # the exact current name or the checkout step fails outright.
  API_GIT_REPO_URL: https://github.com/${{ github.repository_owner }}/cytron-beaver-iot.git
  INTEGRATIONS_GIT_REPO_URL: https://github.com/${{ github.repository_owner }}/beaver-iot-integrations.git
  WEB_GIT_REPO_URL: https://github.com/${{ github.repository_owner }}/beaver-iot-web.git
  REGISTRY: ghcr.io

jobs:
  # Docker image references must be all-lowercase; github.repository_owner resolves to
  # the account's exact casing (ZGMFX20AR here), which buildx rejects outright at push
  # time. GitHub Actions expressions have no built-in case-conversion function, so this
  # has to go through an actual shell step rather than `${{ }}` alone.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image_owner: ${{ steps.owner.outputs.value }}
    steps:
      - name: Lowercase the image owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  # The backend build was previously one multi-platform buildx invocation on ubuntu-latest
  # (amd64), which meant the arm64 leg had to be QEMU-emulated to build it - and a 3-stage
  # Maven Reactor clone-and-build under QEMU turned out to regularly run past 90+ minutes
  # with no guarantee of ever finishing. Since this is a public repo, GitHub provides free
  # hosted native arm64 runners (ubuntu-24.04-arm), so each architecture now builds natively
  # on its own runner - no emulation, no QEMU step needed in either - and the two resulting
  # single-arch images are stitched into one multi-arch manifest afterwards.
  build-backend-amd64:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Copy Hailo binaries into build context
        run: |
          mkdir -p build-docker/hailo-context
          cp build-docker/npu-context/hailo-ollama build-docker/hailo-context/
          cp -r build-docker/npu-context/hailo-ollama-share build-docker/hailo-context/
          cp build-docker/npu-context/libhailort.so.5.3.0 build-docker/hailo-context/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve branch to build
        id: branch
        run: |
          # repository_dispatch carries the pushed branch in client_payload; workflow_dispatch
          # uses the manual input instead.
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "api_branch=${{ github.event.client_payload.branch || 'main' }}" >> "$GITHUB_OUTPUT"
          else
            echo "api_branch=${{ github.event.inputs.api_git_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push backend (linux/amd64, NPU-conditional)
        uses: docker/build-push-action@v6
        with:
          context: build-docker
          file: build-docker/beaver-iot-api-npu.dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            API_GIT_REPO_URL=${{ env.API_GIT_REPO_URL }}
            API_GIT_BRANCH=${{ steps.branch.outputs.api_branch }}
            INTEGRATIONS_GIT_REPO_URL=${{ env.INTEGRATIONS_GIT_REPO_URL }}
            INTEGRATIONS_GIT_BRANCH=${{ steps.branch.outputs.api_branch }}
          # Intermediate, per-arch tag only - never :latest here. The manifest job below
          # combines this with the arm64 image into the real :latest / :run_number tags.
          tags: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_owner }}/beaver-iot-api:${{ github.run_number }}-amd64
          cache-from: type=gha,scope=backend-amd64
          cache-to: type=gha,mode=max,scope=backend-amd64

  build-backend-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Copy Hailo binaries into build context
        run: |
          mkdir -p build-docker/hailo-context
          cp build-docker/npu-context/hailo-ollama build-docker/hailo-context/
          cp -r build-docker/npu-context/hailo-ollama-share build-docker/hailo-context/
          cp build-docker/npu-context/libhailort.so.5.3.0 build-docker/hailo-context/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve branch to build
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "api_branch=${{ github.event.client_payload.branch || 'main' }}" >> "$GITHUB_OUTPUT"
          else
            echo "api_branch=${{ github.event.inputs.api_git_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push backend (linux/arm64, NPU-conditional)
        uses: docker/build-push-action@v6
        with:
          context: build-docker
          file: build-docker/beaver-iot-api-npu.dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            API_GIT_REPO_URL=${{ env.API_GIT_REPO_URL }}
            API_GIT_BRANCH=${{ steps.branch.outputs.api_branch }}
            INTEGRATIONS_GIT_REPO_URL=${{ env.INTEGRATIONS_GIT_REPO_URL }}
            INTEGRATIONS_GIT_BRANCH=${{ steps.branch.outputs.api_branch }}
          tags: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_owner }}/beaver-iot-api:${{ github.run_number }}-arm64
          cache-from: type=gha,scope=backend-arm64
          cache-to: type=gha,mode=max,scope=backend-arm64

  build-backend-manifest:
    needs: [prepare, build-backend-amd64, build-backend-arm64]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine per-arch images into one multi-arch manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_owner }}/beaver-iot-api"
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:${{ github.run_number }}" \
            "$IMAGE:${{ github.run_number }}-amd64" \
            "$IMAGE:${{ github.run_number }}-arm64"

  build-frontend:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for cross-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve branch to build
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "web_branch=${{ github.event.client_payload.branch || 'main' }}" >> "$GITHUB_OUTPUT"
          else
            echo "web_branch=${{ github.event.inputs.web_git_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push frontend (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: build-docker
          file: build-docker/beaver-iot-web.dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            WEB_GIT_REPO_URL=${{ env.WEB_GIT_REPO_URL }}
            WEB_GIT_BRANCH=${{ steps.branch.outputs.web_branch }}
          tags: |
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_owner }}/beaver-iot-web:latest
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_owner }}/beaver-iot-web:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Single-container image combining the just-published api + web images, for parity
  # with Milesight's own `docker run ... milesight/beaver-iot` UX. Doesn't recompile
  # anything from source - just layers nginx + the web assets onto the api image - so
  # unlike build-backend it doesn't need native per-arch runners; the actual new work
  # here (an apt-get install and some file copies) is cheap enough that QEMU on the
  # emulated leg is a non-issue.
  build-monolith:
    needs: [prepare, build-backend-manifest, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for cross-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push monolith (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: build-docker
          file: build-docker/beaver-iot-monolith.dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_API_IMAGE=${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_owner }}/beaver-iot-api:latest
            BASE_WEB_IMAGE=${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_owner }}/beaver-iot-web:latest
          tags: |
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_owner }}/beaver-iot:latest
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_owner }}/beaver-iot:${{ github.run_number }}
          cache-from: type=gha,scope=monolith
          cache-to: type=gha,mode=max,scope=monolith
